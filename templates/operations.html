{% extends "base_template.html" %}

{% block Title %} Operations {% endblock %}

{% block content %}
     <header>
         <p>Welcome to you!</p>
     </header>

    <form action="{{url_for('add')}}" method="post" class="box">
        <input type="text" name="item_name" placeholder="Item's name" required>
        <br>

        <input type="number" name="item_quantity" min="1" max="100" required>
        <br>

        <a href="{{ url_for('print_groceries') }}">
            <button type="submit">
                Go
            </button>
        </a>

    </form>

     {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p> {{msg}} </p>
            {% endfor %}

        {% endif %}
    {% endwith %}

{% endblock %}
